name: Deploy bilingual Shiny
on:
  push:
    branches: [main, feat/report-shiny-delivery]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::bslib
            any::ggplot2
            any::jsonlite
            any::readr
            any::dplyr
            any::digest
      - name: Rebuild corrected data and export browser application
        run: Rscript scripts/export_shinylive.R
      - uses: actions/upload-pages-artifact@v3
        with:
          path: scratch/site
  deploy:
    if: github.repository_owner == 'Tangzy0121'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
